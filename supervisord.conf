; supervisord runs everything in the box. The sys-* programs are the server
; itself; the user's services come from /data/linux/services (see `svc`).
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
; nodaemon already echoes supervisord's own log to stdout.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
childlogdir=/data/linux/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:sys-nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sys-sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sys-ttyd]
command=/usr/local/lib/linux/ttyd-run
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sys-cron]
command=/usr/sbin/cron -f
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Reinstalls saved apt packages, then lets the user's services start.
[program:sys-restore]
command=/usr/local/lib/linux/restore
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Railway counts the kernel's cache of files this container has touched as the
; service's memory, and with no memory pressure it is never freed. Drop it for
; the volume every 15 min.
[program:sys-cache]
command=/bin/bash -c "while sleep 900; do nice -n 19 /usr/local/lib/linux/drop-file-cache /data /tmp || true; done"
autorestart=true
stdout_logfile=/dev/null

[include]
files=/data/linux/services/*.conf
